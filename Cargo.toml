# re-zerve workspace.
# Versions match terp-rs workspace.dependencies. Patches point at the
# existing terp-core checkouts (local CosmWasm, local zakura-halo2).
# This is not a second Halo2 tree.
#
# rand is 0.10 because zakura-halo2-proofs 5.0.0 binds Rng at 0.10.
# terp-rs workspace.dependencies still lists rand 0.9 for other crates.

[workspace]
resolver = "2"
# private-inference-rent (crate/) is a member. Unblocked by cw-orch-core
# default feature zk = off (patched checkout packages/cw-orch-core).
# That feature pulls zk-cosmwasm -> wasmer-types sha2 ^0.11, which cannot
# unify with bip32 0.6.0-pre.1 sha2 =0.11.0-pre.4 (zcash_transparent 0.10
# and zcash_script 0.4). cw-orch feature zk still opts in. A sha2 0.11
# upgrade of bip32 is not viable: zcash_primitives 0.30 pins
# crypto-common =0.2.0-rc.1. live-chain stays excluded. Not a second Halo2
# tree. halo2_proofs stays zakura-halo2-proofs 5.0.0, feature batch only.

members = [
    "crate",
    "crate/circuits/hosting-payment",
    "crate/cw-commit",
    "crate/cw-escrow",
    "crate/cw-zap1-ibcv2",
    "crate/interface",
]
exclude = [
    "crate/live-chain",
]

[workspace.dependencies]
cosmwasm-schema = { version = "=4.1.0" }
cosmwasm-std = { version = "=4.1.0", default-features = false, features = ["exports", "iterator", "std"] }
cw-ics08-wasm-zap1 = { path = "../terp-core/crates/terp-rs/contracts/light-clients/cw-ics08-wasm-zap1" }
cw-orch = { version = "0.30.0" }
cw-storage-plus = { version = "3.0.1" }
ff = "0.14"
group = "0.14"
halo2_proofs = { package = "zakura-halo2-proofs", version = "=5.0.0", default-features = false, features = ["batch"] }
hex = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "=5.0.0", default-features = false, features = ["default"] }
rand = "0.10"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
terp-seams = { path = "../terp-core/crates/terp-rs/crates/terp-seams", default-features = false }
thiserror = "2.0"
zap1-verify = "0.2.1"

[patch.crates-io]
cosmwasm-core = { path = "../terp-core/crates/cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../terp-core/crates/cosmwasm/packages/crypto" }
