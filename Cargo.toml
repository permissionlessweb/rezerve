cosmwasm-std = { path = "../terp-core/crates/cosmwasm/packages/std" }
cw-schema = { path = "../terp-core/crates/cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../terp-core/crates/cosmwasm/packages/cw-schema-derive" }
cw-storage-plus = { path = "../terp-core/crates/cw-storage-plus" }
cw-controllers = { path = "../terp-core/crates/cw-minus/packages/controllers" }
cw-utils = { path = "../terp-core/crates/cw-minus/packages/cw-utils" }
