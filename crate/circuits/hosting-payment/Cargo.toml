[package]
name = "hosting-payment"
version = "0.1.0"
edition = "2021"
description = "Halo2 HOSTING_PAYMENT inclusion: ZAP1 BLAKE2b-256 Merkle (siblings private; 128-byte instances)"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "export-halo2"
path = "src/bin/export-halo2.rs"
required-features = ["store-full-circuit"]

[features]
default = []
# Path A store-full-circuit needs CS.write + 80-byte CircuitFooter.
# zakura-halo2-proofs (workspace patch) has CS write. crates.io halo2_proofs 0.3 does not.
store-full-circuit = []

[dependencies]
ff = { workspace = true }
group = { workspace = true }
halo2_proofs = { workspace = true }
pasta_curves = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zap1-verify = { workspace = true }
