[package]
name = "pir-live-chain"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pir-live-attach"
path = "src/main.rs"

[dependencies]
ict-rs = { path = "../../../terp-core/crates/ict-rs/ict-rs", features = ["docker", "terp", "testing"] }
ict-rs-cw-orch = { path = "../../../terp-core/crates/ict-rs/ict-rs-cw-orch", features = ["docker"] }
cw-orch = { path = "../../../terp-core/crates/cw-orchestrator/cw-orch", features = ["daemon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[workspace]

[patch.crates-io]
cosmwasm-core = { path = "../../../terp-core/crates/cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../../../terp-core/crates/cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../../../terp-core/crates/cosmwasm/packages/derive" }
cosmwasm-schema = { path = "../../../terp-core/crates/cosmwasm/packages/schema" }
cosmwasm-schema-derive = { path = "../../../terp-core/crates/cosmwasm/packages/schema-derive" }
cosmwasm-std = { path = "../../../terp-core/crates/cosmwasm/packages/std" }
cw-schema = { path = "../../../terp-core/crates/cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../../../terp-core/crates/cosmwasm/packages/cw-schema-derive" }
cw-storage-plus = { path = "../../../terp-core/crates/cw-storage-plus" }
cw-controllers = { path = "../../../terp-core/crates/cw-minus/packages/controllers" }
cw-utils = { path = "../../../terp-core/crates/cw-minus/packages/cw-utils" }
cw2 = { path = "../../../terp-core/crates/cw-minus/packages/cw2" }
cw-orch = { path = "../../../terp-core/crates/cw-orchestrator/cw-orch" }
cw-orch-core = { path = "../../../terp-core/crates/cw-orchestrator/packages/cw-orch-core" }
cw-orch-daemon = { path = "../../../terp-core/crates/cw-orchestrator/cw-orch-daemon" }
cw-orch-mock = { path = "../../../terp-core/crates/cw-orchestrator/packages/cw-orch-mock" }
cw-orch-networks = { path = "../../../terp-core/crates/cw-orchestrator/packages/cw-orch-networks" }
cw-orch-traits = { path = "../../../terp-core/crates/cw-orchestrator/packages/cw-orch-traits" }
zakura-halo2-proofs = { path = "../../../terp-core/crates/zakura-common/crates/halo2_proofs" }
zakura-halo2-gadgets = { path = "../../../terp-core/crates/zakura-common/crates/halo2_gadgets" }
zakura-pasta-curves = { path = "../../../terp-core/crates/zakura-common/crates/pasta_curves" }

zakura-halo2-poseidon = { path = "../../../terp-core/crates/zakura-common/crates/halo2_poseidon" }
zakura-reddsa = { path = "../../../terp-core/crates/zakura-common/crates/reddsa" }
zakura-sinsemilla = { path = "../../../terp-core/crates/zakura-common/crates/sinsemilla" }
zakura-orchard = { path = "../../../terp-core/crates/zakura-common/crates/orchard" }
cosmwasm-vm = { path = "../../../terp-core/crates/cosmwasm/packages/vm" }
tendermint = { path = "../../../terp-core/crates/tendermint-rs/tendermint" }
tendermint-proto = { path = "../../../terp-core/crates/tendermint-rs/proto" }
tendermint-rpc = { path = "../../../terp-core/crates/tendermint-rs/rpc" }
tendermint-config = { path = "../../../terp-core/crates/tendermint-rs/config" }
tendermint-light-client = { path = "../../../terp-core/crates/tendermint-rs/light-client" }
tendermint-light-client-detector = { path = "../../../terp-core/crates/tendermint-rs/light-client-detector" }
tendermint-light-client-verifier = { path = "../../../terp-core/crates/tendermint-rs/light-client-verifier" }
cosmrs = { path = "../../../terp-core/crates/cosmos-rust/cosmrs" }
ibc-proto = { path = "../../../terp-core/crates/ibc-proto-rs" }
cosmos-sdk-proto = { path = "../../../terp-core/crates/cosmos-rust/cosmos-sdk-proto" }
abstract-cw-multi-test = { path = "../../../terp-core/crates/cw-multi-test-fork" }
cw20-ics20 = { path = "../../../terp-core/crates/cw-plus/contracts/cw20-ics20" }
