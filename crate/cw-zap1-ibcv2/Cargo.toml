[package]
name = "cw-zap1-ibcv2"
version = "0.1.0"
edition = "2021"
description = "ZAP1 + IBC v2 packet attestation CosmWasm module (not Crosslink 08-wasm, not all 9 ICS-08 entrypoints)"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
overflow-checks = true

[dependencies]
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
zap1-verify = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cw-orch = { workspace = true }
hosting-payment = { path = "../circuits/hosting-payment" }
