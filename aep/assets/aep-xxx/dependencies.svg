<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
  <title id="t">Dependencies and requirements</title>
  <desc id="d">Four required surfaces: custom Akash provider, CosmWasm on Terp, ZAP1 IBC v2, and configurable FROST validator sidecars.</desc>
  <rect width="960" height="320" fill="#f8fafc"/>
  <text x="24" y="28" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em" fill="#0f172a">DEPENDENCIES · REQUIRED FOR THE FIRST DEMO</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <rect x="24" y="48" width="210" height="140" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="129" y="80" font-size="14" font-weight="700" fill="#92400e">Custom provider</text>
    <text x="129" y="104" font-size="12" fill="#0f172a">Akash provider-services</text>
    <text x="129" y="124" font-size="11" fill="#334155">PIR gate + serve</text>
    <text x="129" y="144" font-size="11" fill="#334155">public path if PIR off</text>
    <text x="129" y="168" font-size="11" fill="#64748b">required image</text>
    <polygon points="242,110 258,118 242,126" fill="#0f172a"/>
    <rect x="266" y="48" width="210" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="371" y="80" font-size="14" font-weight="700" fill="#1e3a8a">Terp CosmWasm</text>
    <text x="371" y="104" font-size="12" fill="#0f172a">commit · escrow grant</text>
    <text x="371" y="124" font-size="11" fill="#334155">Halo2 host verify</text>
    <text x="371" y="144" font-size="11" fill="#334155">does not pay notes</text>
    <text x="371" y="168" font-size="11" fill="#64748b">required chain</text>
    <polygon points="484,110 500,118 484,126" fill="#0f172a"/>
    <rect x="508" y="48" width="210" height="140" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="613" y="80" font-size="14" font-weight="700" fill="#065f46">ZAP1 IBC v2</text>
    <text x="613" y="104" font-size="12" fill="#0f172a">pay inclusion</text>
    <text x="613" y="124" font-size="11" fill="#334155">packet attest</text>
    <text x="613" y="144" font-size="11" fill="#334155">not Crosslink headers</text>
    <text x="613" y="168" font-size="11" fill="#64748b">required client</text>
    <polygon points="726,110 742,118 726,126" fill="#0f172a"/>
    <rect x="750" y="48" width="186" height="140" rx="10" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="843" y="80" font-size="14" font-weight="700" fill="#312e81">FROST sidecars</text>
    <text x="843" y="104" font-size="12" fill="#0f172a">t-of-n, configurable</text>
    <text x="843" y="124" font-size="11" fill="#334155">Penumbra validator</text>
    <text x="843" y="144" font-size="11" fill="#334155">sidecars hold shares</text>
    <text x="843" y="168" font-size="11" fill="#64748b">required signers</text>
  </g>
  <rect x="24" y="208" width="912" height="88" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="48" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Without any one of these, the first demo does not run.</text>
  <text x="48" y="266" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#334155">Provider image allocates. Terp records the market. ZAP1 proves pay. Sidecars sign. n and t are parameters; first demo is 2-of-3.</text>
</svg>
